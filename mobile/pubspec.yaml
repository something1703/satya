name: satya
description: "SATYA — On-Device Truth Detection Powered by Gemma 4"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8

  # Gemma 4 inference (on-device LLM)
  flutter_gemma: ^0.15.1

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Content hashing
  crypto: ^3.0.5

  # Media handling
  image_picker: ^1.1.2
  image: ^4.5.3
  receive_sharing_intent: ^1.8.1

  # UI utilities
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

  # Path utilities
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/analysis/prompts/
